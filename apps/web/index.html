<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>CoinPosh</title>
    <link rel="icon" href="data:," />
    <link
      rel="preload"
      as="image"
      href="/poster-riviera.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #stage {
        display: block;
        width: 100vw;
        height: 100dvh;
        touch-action: none;
      }
      /* Painted until the renderer's first lit frame; the HUD fades it out, then removes it. */
      #cp-poster {
        position: fixed;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
        background: linear-gradient(#b09077 0%, #896a54 45%, #322322 100%);
        transition: opacity 820ms cubic-bezier(0.33, 0, 0.2, 1);
      }
      #cp-poster.is-lit {
        opacity: 0;
      }
      #cp-poster img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 40%;
      }
      #cp-poster .cp-poster-backdrop {
        display: none;
      }
      @media (min-aspect-ratio: 3/4) {
        #cp-poster .cp-poster-backdrop {
          display: block;
          scale: 1.15;
          filter: blur(28px) brightness(0.85) saturate(1.1);
        }
        #cp-poster .cp-poster-set {
          left: 50%;
          width: auto;
          translate: -50% 0;
          mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="cp-poster" aria-hidden="true">
      <img class="cp-poster-backdrop" src="/poster-riviera.webp" alt="" decoding="async" />
      <img
        class="cp-poster-set"
        src="/poster-riviera.webp"
        alt=""
        width="585"
        height="1266"
        fetchpriority="high"
        decoding="async"
      />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
