<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>CoinPosh vfx preview</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f1a;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100dvh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: 16px;
        padding: 8px 16px;
        border-radius: 14px;
        border: 1px solid rgba(201, 162, 75, 0.7);
        background: rgba(22, 18, 14, 0.55);
        backdrop-filter: blur(10px);
        color: #fff8ec;
        font:
          600 20px/1.2 'Playfair Display',
          Georgia,
          serif;
        font-variant-numeric: tabular-nums;
        z-index: 40;
        transition: transform 120ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #hud[data-bump='1'] {
        transform: scale(1.12);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="preview"></canvas>
      <div id="hud"><span id="balance">0</span></div>
    </div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
