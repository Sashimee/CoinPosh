<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>CoinPosh unbox preview</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f1a;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 100vw;
        height: 100dvh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #bbox {
        position: absolute;
        border: 1px dashed rgba(120, 255, 180, 0.9);
        pointer-events: none;
        display: none;
      }
      body[data-overlay] #bbox {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="preview"></canvas>
      <div id="bbox"></div>
    </div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
