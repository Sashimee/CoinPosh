<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>CoinPosh</title>
    <link rel="icon" href="data:," />
    <!--
      GitHub Pages serves this file for any unknown path. The app routes by hash/state,
      so a deep link is sent back to the app root with its query and hash intact.
      public/ is copied verbatim (no base rewriting), so the base must match vite.config.ts.
    -->
    <script>
      (function () {
        var base = '/CoinPosh/';
        var path = window.location.pathname;
        if (path.indexOf(base) !== 0 || path === base) {
          return;
        }
        window.location.replace(base + window.location.search + window.location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/CoinPosh/" /></noscript>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      a {
        font:
          500 clamp(1.5rem, 6vw, 2.5rem) / 1 'Iowan Old Style',
          'Palatino Linotype',
          Palatino,
          Georgia,
          serif;
        letter-spacing: 0.08em;
        text-decoration: none;
        color: transparent;
        background: linear-gradient(
            100deg,
            #8a6a2f 0%,
            #f4d78a 35%,
            #fff6d6 50%,
            #f4d78a 65%,
            #8a6a2f 100%
          )
          0 0 / 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        opacity: 0;
        animation:
          appear 600ms 200ms ease-out forwards,
          sheen 2.4s 400ms ease-in-out infinite;
      }
      a:focus-visible {
        outline: 1px solid #f4d78a;
        outline-offset: 0.4em;
      }
      @keyframes appear {
        to {
          opacity: 1;
        }
      }
      @keyframes sheen {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          opacity: 1;
          animation: none;
          background-position: 50% 0;
        }
      }
    </style>
  </head>
  <body>
    <a href="/CoinPosh/">CoinPosh</a>
  </body>
</html>
