name: Deploy web

# Publishes the web build that CI made and verified, and only after that CI run passed, so a
# red main never reaches Pages and the app is built once. To redeploy by hand, run CI on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download CI web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check artifact
        working-directory: dist
        run: |
          test -f index.html || { echo "::error::The web-dist artifact from CI run ${{ github.event.workflow_run.id }} has no index.html. Check the Upload web build step in .github/workflows/ci.yml."; exit 1; }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Report URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "::notice title=CoinPosh web deployed::$PAGE_URL (${SHA:0:7})"
          echo "### Deployed ${SHA:0:7} to $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Built and verified by CI: $CI_RUN" >> "$GITHUB_STEP_SUMMARY"
