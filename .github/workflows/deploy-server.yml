name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  gate:
    name: Check Cloudflare credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.secret.outputs.enabled }}
    steps:
      - id: secret
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice title=Server deploy skipped::Repository secret CLOUDFLARE_API_TOKEN is not set. Add it (and CLOUDFLARE_ACCOUNT_ID) to deploy the Worker; the web client keeps working in Demo Mode."
            echo "### Server deploy skipped: CLOUDFLARE_API_TOKEN is not set" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy Worker
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-workers
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Require account ID
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not set. Add it next to CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Test server
        run: pnpm --filter @coinposh/server test

      - name: Apply D1 migrations
        if: hashFiles('apps/server/migrations/*.sql') != ''
        working-directory: apps/server
        run: pnpm exec wrangler d1 migrations apply coinposh --remote

      - id: deploy
        name: Deploy
        working-directory: apps/server
        run: |
          set -o pipefail
          pnpm exec wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler deploy succeeded but printed no workers.dev URL. Enable the workers.dev route for coinposh-server in apps/server/wrangler.jsonc or the Cloudflare dashboard."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed Worker: $url"
          echo "::notice title=CoinPosh server deployed::$url"
          echo "### Deployed Worker: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable VITE_API_URL to this URL to take the web client out of Demo Mode." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "$URL/health") && break
            echo "Attempt $attempt: $URL/health not ready yet"
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::$URL/health did not answer {\"status\":\"ok\"} after deploy."; exit 1; }
