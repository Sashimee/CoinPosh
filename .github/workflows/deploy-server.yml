name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  gate:
    name: Check Cloudflare credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.secret.outputs.enabled }}
    steps:
      - id: secret
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice title=Server deploy skipped::Repository secret CLOUDFLARE_API_TOKEN is not set. Add it (and CLOUDFLARE_ACCOUNT_ID) to deploy the Worker; the web client keeps working in Demo Mode."
            echo "### Server deploy skipped: CLOUDFLARE_API_TOKEN is not set" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy Worker
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-workers
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require deploy secrets
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          where="GitHub > Settings > Secrets and variables > Actions > New repository secret"
          missing=0
          require() {
            if [ -z "${!1}" ]; then
              echo "::error title=Missing secret $1::Repository secret $1 is not set ($2). Add it under $where, then re-run this workflow."
              missing=1
            fi
          }
          require CLOUDFLARE_ACCOUNT_ID "the account ID shown in the Cloudflare dashboard sidebar"
          require AUTH_SECRET "the Worker's access-token signing key, at least 32 random characters: openssl rand -base64 48"
          require TURNSTILE_SECRET_KEY "the secret key of the Turnstile widget, from Cloudflare dashboard > Turnstile"
          if [ -n "$AUTH_SECRET" ] && [ "${#AUTH_SECRET}" -lt 32 ]; then
            echo "::error title=AUTH_SECRET too short::Repository secret AUTH_SECRET has ${#AUTH_SECRET} characters; the Worker needs at least 32. Replace it with the output of: openssl rand -base64 48"
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Test server
        run: pnpm --filter @coinposh/server test

      - name: Apply D1 migrations
        if: hashFiles('apps/server/migrations/*.sql') != ''
        working-directory: apps/server
        run: pnpm exec wrangler d1 migrations apply coinposh --remote

      - id: deploy
        name: Deploy
        working-directory: apps/server
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -o pipefail
          # Uploaded with the new version, so no request ever reaches code that lacks its secrets.
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          (umask 077 && jq -n '{AUTH_SECRET: env.AUTH_SECRET, TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY}' > "$secrets_file")
          pnpm exec wrangler deploy --secrets-file "$secrets_file" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler deploy succeeded but printed no workers.dev URL. Enable the workers.dev route for coinposh-server in apps/server/wrangler.jsonc or the Cloudflare dashboard."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed Worker: $url"
          echo "::notice title=CoinPosh server deployed::$url"
          echo "### Deployed Worker: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable VITE_API_URL to this URL to take the web client out of Demo Mode." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /health
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "$URL/health") && break
            echo "Attempt $attempt: $URL/health not ready yet"
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::$URL/health did not answer {\"status\":\"ok\"} after deploy."; exit 1; }

      - name: Smoke test /v1/auth/guest
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # An unsigned request must get past the AUTH_SECRET check and be refused for its missing
          # Idempotency-Key; a Worker without the secret answers 503 "AUTH_SECRET is not configured".
          body=$(curl -sS --max-time 10 -X POST -w '\nHTTP %{http_code}' "$URL/v1/auth/guest")
          echo "$body"
          echo "$body" | grep -q '"code":"idempotency_key_missing"' || { echo "::error::$URL/v1/auth/guest did not reach request validation, so /auth is not usable. Check the AUTH_SECRET Worker secret (wrangler secret list) and the response above."; exit 1; }
