name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Check (format, typecheck, lint, unit)
        run: pnpm check

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Enforce bundle budget
        run: |
          if grep -q 'Some chunks are larger than' "$RUNNER_TEMP/build.log"; then
            echo "::error file=apps/web/vite.config.ts::A chunk exceeds build.chunkSizeWarningLimit. Split it with a dynamic import() or justify raising the budget in apps/web/vite.config.ts."
            exit 1
          fi
