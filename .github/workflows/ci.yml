name: CI

# Feature PRs target dev and are checked here. A dev -> main PR is not: its head commit is the
# dev tip that the push run below already checked, and GitHub shows that run's status on the PR.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Turbo hashes every task's inputs, so a restored cache only replays tasks whose inputs are unchanged.
      - id: turbo-cache
        name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Check (format, typecheck, lint, unit)
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"

      # A cache hit replays the original build log, so this still sees Vite's chunk-size warning.
      - name: Enforce bundle budget
        run: |
          if grep -q 'Some chunks are larger than' "$RUNNER_TEMP/build.log"; then
            echo "::error file=apps/web/vite.config.ts::A chunk exceeds build.chunkSizeWarningLimit. Split it with a dynamic import() or justify raising the budget in apps/web/vite.config.ts."
            exit 1
          fi

      - name: Verify Pages output
        working-directory: apps/web/dist
        run: |
          test -f index.html || { echo "::error::apps/web/dist/index.html is missing; the Vite build produced no entry page."; exit 1; }
          test -f 404.html || { echo "::error::apps/web/dist/404.html is missing; deep links would hit the GitHub 404 page. Check apps/web/public/404.html."; exit 1; }
          grep -q 'src="/CoinPosh/assets/' index.html || { echo "::error::index.html does not load assets from /CoinPosh/; check base in apps/web/vite.config.ts."; exit 1; }

      - name: Summarize run
        if: ${{ !cancelled() }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          CACHE_KEY: ${{ steps.turbo-cache.outputs.cache-matched-key }}
        run: |
          if [ -z "${VITE_API_URL//[[:space:]]/}" ]; then
            mode="Demo Mode (repo variable VITE_API_URL is unset or empty)"
          else
            mode="Live API at $VITE_API_URL"
          fi
          echo "::notice title=CoinPosh web build::$mode"
          {
            echo "### CoinPosh web build: $mode"
            echo
            echo "Turbo cache restored from: \`${CACHE_KEY:-none (cold run)}\`"
            for phase in check build; do
              log="$RUNNER_TEMP/$phase.log"
              [ -f "$log" ] || continue
              echo
              echo "**pnpm $phase**"
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -E '^ *(Tasks|Cached|Time): ' || echo "(no turbo summary)"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Every save carries the restored entries forward, so drop week-old ones to keep the cache small.
      # A pruned entry that is still current just rebuilds once.
      - name: Prune turbo cache
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p .turbo/cache
          find .turbo/cache -type f -mtime +7 -delete
          du -sh .turbo/cache

      # Saved on failure too: turbo only caches tasks that passed, so the next run skips those.
      - name: Save turbo cache
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      # Deploy web publishes exactly this build once the run is green, instead of rebuilding it.
      - name: Upload web build for Deploy web
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3
