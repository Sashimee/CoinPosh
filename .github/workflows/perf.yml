name: Perf

# E2E flows and perf budgets on the Demo Mode build. Thresholds and their sources live in
# apps/web/e2e/budgets.ts; CI chromium has no GPU, so it renders WebGL2 on SwiftShader.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: E2E and perf budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Build Demo Mode
        id: build
        env:
          VITE_API_URL: ''
        run: pnpm --filter @coinposh/web... build

      - name: Bundle budgets
        run: pnpm --filter @coinposh/web bundle:check

      # A red bundle gate must not hide the e2e and perf results, so the steps after it still run.
      - name: Install Playwright chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # One run for both projects, so the HTML report covers every flow and budget.
      - name: E2E flows and perf budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/web
        env:
          VITE_API_URL: ''
        run: pnpm exec playwright test -c e2e/playwright.config.ts --project=e2e --project=perf --trace off

      - name: Summarize perf
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node e2e/perf-summary.ts

      - name: Upload screenshots and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ github.run_attempt }}
          path: |
            apps/web/test-results/screenshots
            apps/web/test-results/perf-report
            apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 14
