name: Perf

# E2E flows, perf budgets and the Lighthouse mobile audit on the Demo Mode build. Thresholds and
# their sources live in apps/web/e2e/budgets.ts and lighthouse.perf.ts; CI chromium has no GPU, so
# it renders WebGL2 on SwiftShader.
#
# The suites run one test at a time (workers: 1), so one job running both projects outgrew its
# 30 min limit (#203). The Demo build is made once and shared; the e2e project is sharded across
# runners, and the perf project gets a runner of its own so the e2e load never skews its timings.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build Demo Mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Build Demo Mode
        env:
          VITE_API_URL: ''
        run: pnpm --filter @coinposh/web... build

      - name: Upload Demo build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-dist-${{ github.run_attempt }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: E2E (shard ${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-24.04
    # About 12 min of tests a shard; the limit is a backstop, not headroom to fill.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Download Demo build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-dist-${{ github.run_attempt }}
          path: apps/web/dist

      - name: Install Playwright chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # The blob reporter lets the report job merge every shard into one HTML report.
      - name: E2E flows
        working-directory: apps/web
        env:
          VITE_API_URL: ''
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: >-
          pnpm exec playwright test -c e2e/playwright.config.ts --project=e2e --trace off
          --shard=${{ matrix.shard }}/3 --reporter=github,list,blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/web/blob-report
          if-no-files-found: warn
          retention-days: 3

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/web/test-results/screenshots
          if-no-files-found: warn
          retention-days: 14

  perf:
    name: Perf budgets, bundle and Lighthouse
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Download Demo build
        id: dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-dist-${{ github.run_attempt }}
          path: apps/web/dist

      - name: Bundle budgets
        run: pnpm --filter @coinposh/web bundle:check

      # A red bundle gate must not hide the perf results, so the steps after it still run.
      - name: Install Playwright chromium
        if: ${{ !cancelled() && steps.dist.outcome == 'success' }}
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # lighthouse.perf.ts (mobile preset, performance >= 80) writes its score and top
      # opportunities to the job summary and perf-report/lighthouse.{json,html}.
      - name: Perf budgets and Lighthouse mobile
        if: ${{ !cancelled() && steps.dist.outcome == 'success' }}
        working-directory: apps/web
        env:
          VITE_API_URL: ''
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: >-
          pnpm exec playwright test -c e2e/playwright.config.ts --project=perf --trace off
          --reporter=github,list,blob

      - name: Summarize perf
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node e2e/perf-summary.ts

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-perf-${{ github.run_attempt }}
          path: apps/web/blob-report
          if-no-files-found: warn
          retention-days: 3

      - name: Upload screenshots and perf reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ github.run_attempt }}
          path: |
            apps/web/test-results/screenshots
            apps/web/test-results/perf-report
          if-no-files-found: warn
          retention-days: 14

  report:
    name: E2E and perf report
    needs: [e2e, perf]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Download blob reports
        if: ${{ needs.e2e.result != 'skipped' || needs.perf.result != 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*-${{ github.run_attempt }}
          path: apps/web/all-blob-reports
          merge-multiple: true

      # One HTML report over every flow and budget, as the single-job run produced.
      - name: Merge into one HTML report
        if: ${{ needs.e2e.result != 'skipped' || needs.perf.result != 'skipped' }}
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter html all-blob-reports

      - name: Upload HTML report
        if: ${{ needs.e2e.result != 'skipped' || needs.perf.result != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 14

      # The sharded jobs are each green or red on their own; this one is green only when all are,
      # so it can stand as the single required check for the workflow.
      - name: Require every e2e shard and the perf job
        if: ${{ !cancelled() }}
        env:
          E2E: ${{ needs.e2e.result }}
          PERF: ${{ needs.perf.result }}
        run: |
          if [ "$E2E" != success ] || [ "$PERF" != success ]; then
            echo "::error::E2E shards: $E2E, perf: $PERF. Open the failing job above for its annotations."
            exit 1
          fi
